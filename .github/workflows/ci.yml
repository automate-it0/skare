name: CI

# CI pipeline for Skare Store.
# Shift-Left: catch lint / type / build issues in CI, never in production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — frees runners + keeps PR signal clean.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Job 1: Lint -----------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        # No `cache:` input on purpose: this project resolves dependencies
        # with bun (bun.lock) and ships no npm/yarn lockfile, so setup-node
        # cannot compute an npm cache key and the step would fail with
        # "Dependencies lock file is not found".

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  # --- Job 2: Type-check -----------------------------------------------------
  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `tsc --noEmit` resolves the generated Prisma client types. Without
      # this step the type-check fails with "Module '@prisma/client' has no
      # exported member 'PrismaClient'".
      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run tsc --noEmit
        run: bunx tsc --noEmit

  # --- Job 3: Build ----------------------------------------------------------
  build:
    name: Build
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma needs a writable DATABASE_URL or it refuses to instantiate.
      # Use a throwaway SQLite file in /tmp — we're only validating the
      # build, not running migrations against real data.
      DATABASE_URL: file:/tmp/test.db
      # NextAuth signs session cookies with this secret. The value is
      # generated for this build only and never leaves the runner.
      NEXTAUTH_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-build-only-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Cache .next/cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('**/*.ts', '**/*.tsx', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-

      - name: Build
        run: bun run build
