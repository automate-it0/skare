version: 2

updates:
  # Root app — Next.js 16 + TypeScript (installed with bun, lockfile: bun.lock)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  # Keep GitHub Actions pinned to fresh versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
